<style>
:root{
  --bg:#f7f8f3;--card:#fff;--line:#e2e7dc;--text:#293129;--muted:#728071;
  --green:#6f9368;--green-dark:#557651;--green2:#eef5ea;--peach:#fff2e8;
  --yellow:#fff8df;--shadow:0 7px 22px rgba(44,61,42,.07);--danger:#a94442;
  --blue:#577fa8;--manual:#8c6f56;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Arial,sans-serif;
  background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent
}
button,input,textarea,select{font:inherit}
button{touch-action:manipulation}
a{color:inherit}
header{position:sticky;top:0;z-index:30;background:#748f6c;color:#fff;padding:13px 17px}
header h1{font-size:19px;margin:0}
header p{font-size:11px;margin:4px 0 0;opacity:.9}
.wrap{max-width:1240px;margin:auto;padding:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.baby-card{padding:14px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(270px,.7fr);gap:12px}
.baby-main{display:flex;gap:12px;align-items:center;min-width:0}
.avatar{width:61px;height:61px;border-radius:19px;background:var(--green2);display:grid;place-items:center;font-size:29px;flex:0 0 auto}
.baby-info h2{margin:0 0 4px;font-size:17px}
.age-big{font-size:24px;font-weight:800;color:var(--green-dark)}
.age-sub{font-size:11px;color:var(--muted);margin-top:3px}
.baby-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
button{border:0;border-radius:10px;min-height:39px;padding:8px 11px;cursor:pointer}
.btn-primary{background:var(--green);color:#fff}
.btn-secondary{background:#edf1ea;color:#344234}
.btn-outline{background:#fff;border:1px solid #b7c8b2;color:var(--green-dark)}
.btn-danger{background:#fff0ef;color:var(--danger)}
.view-tabs{display:flex;gap:6px;margin-top:9px}
.view-tabs button{flex:1;background:#e9eee5;color:#526052}
.view-tabs button.active{background:var(--green);color:#fff;font-weight:700}
.navbar{margin-top:9px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:7px}
.nav-title{text-align:center;min-width:0}
.nav-title b{display:block;font-size:15px}
.nav-title span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.nav-actions{display:flex;gap:5px;flex-shrink:0}
.nav-actions button{min-width:42px}
.auto-box{margin-top:9px;padding:12px;background:#f4f8f1;border-color:#d8e5d3}
.auto-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.auto-copy h2{font-size:15px;margin:0 0 3px}
.auto-copy p{font-size:11px;color:var(--muted);margin:0;line-height:1.45}
.auto-buttons{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fill-option{margin-top:8px;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.fill-option input{width:17px;height:17px}
.pantry-box{margin-top:10px;padding:10px;border:1px solid #d8e5d3;border-radius:12px;background:#fff}
.pantry-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.pantry-head strong{font-size:12px}
.pantry-head span{font-size:9px;color:var(--muted)}
.pantry-input{width:100%;min-height:58px;resize:vertical;border:1px solid #d7e0d3;border-radius:9px;padding:8px;font-size:11px;line-height:1.5}
.pantry-options{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:7px;font-size:10px;color:var(--muted)}
.pantry-options label{display:flex;align-items:center;gap:5px}
.pantry-options input{width:16px;height:16px}
.pantry-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.pantry-chip{font-size:9px;padding:4px 7px;border-radius:999px;background:#eef5ea;color:#4f6d4b;border:1px solid #dbe8d7}
.pantry-status{font-size:10px;color:var(--green-dark);font-weight:700;margin-top:7px}
.shortage{color:#a94442!important}

.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.stat{padding:11px}
.stat label{font-size:10px;color:var(--muted)}
.stat b{display:block;font-size:19px;margin-top:3px}
.stat small{font-size:9px;color:var(--muted)}
.section{margin-top:9px;padding:12px}
.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:9px;margin-bottom:9px}
.section-head h2{font-size:15px;margin:0 0 3px}
.small{font-size:10px;color:var(--muted);line-height:1.5}
.meal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.day-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;min-width:0}
.day-card.today{outline:2px solid #97b590}
.day-head{padding:8px 7px;background:#f2f6ef;display:flex;justify-content:space-between;align-items:center}
.day-head strong{font-size:12px}
.day-head span{font-size:10px;color:var(--muted)}
.day-body{padding:7px}
.meal-row{margin-bottom:7px}
.meal-row:last-child{margin-bottom:0}
.meal-label{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:3px}
.meal-label label{font-size:9px;color:var(--muted)}
.badge{font-size:8px;padding:2px 5px;border-radius:999px;background:#edf4fb;color:var(--blue)}
.badge.manual{background:#f4eee8;color:var(--manual)}
.meal-row textarea{
  width:100%;resize:vertical;min-height:49px;border:1px solid #dfe5da;border-radius:8px;padding:6px;font-size:11px;background:#fff
}
.recipe-links{display:flex;gap:4px;margin-top:4px}

.recipe-source{font-size:8px;color:var(--muted);margin-top:3px;line-height:1.35}
.recipe-links a.real{background:#eef5ea;color:#486342;border-color:#cfdec9;font-weight:700}
.recipe-links a.search{background:#f7f7f5;color:#6a7468}
.recipe-links a{
  flex:1;text-align:center;text-decoration:none;font-size:9px;border-radius:7px;
  padding:5px 3px;background:#f2f5ef;color:#4e6650;border:1px solid #e0e8dd
}
.day-tools{display:flex;gap:4px;margin-top:7px}
.day-tools button{min-height:29px;padding:4px 6px;font-size:9px;flex:1}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.month-weekday{text-align:center;font-size:10px;color:var(--muted);padding:3px}
.month-cell{border:1px solid var(--line);border-radius:10px;background:#fff;min-height:130px;padding:7px;cursor:pointer}
.month-cell.empty{background:transparent;border-color:transparent;cursor:default}
.month-cell.today{outline:2px solid #97b590}
.month-date{font-size:11px;font-weight:700;margin-bottom:5px}
.month-meal{font-size:9px;line-height:1.35;margin:3px 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.month-meal b{color:#667765}
.month-more{font-size:8px;color:var(--muted);margin-top:4px}
.month-hint{text-align:center;font-size:10px;color:var(--muted);margin-top:8px}
.source-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.source-card{border:1px solid var(--line);border-radius:12px;padding:11px;text-decoration:none;background:#fff}
