name: Apply DB-first recommendation upgrade

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-db-first-recommendation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Patch recommendation engine
        run: python tools/patch_db_first.py

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- index.html sw.js; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "app-upgrade-bot"
          git config user.email "app-upgrade-bot@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "feat: recommend meals from recipe database first"
          git push
