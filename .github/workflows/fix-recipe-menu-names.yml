name: Fix recipe menu names

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-recipe-menu-names.yml'
      - 'tools/fix_recipe_menu_names.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Patch menu naming
        run: python tools/fix_recipe_menu_names.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>', s)
          if not m: raise SystemExit('script not found')
          Path('/tmp/app.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html sw.js; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "app-fix-bot"
          git config user.email "app-fix-bot@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "fix: infer actual menu names from recipe titles"
          git push
