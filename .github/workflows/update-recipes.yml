name: Update toddler recipe database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

jobs:
  update-recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install updater dependencies
        run: pip install -r requirements-updater.txt
      - name: Refresh recipe database
        run: python tools/update_recipes.py
      - name: Commit database changes
        run: |
          if git diff --quiet -- recipes.json; then
            echo "No recipe database changes."
            exit 0
          fi
          git config user.name "recipe-db-bot"
          git config user.email "recipe-db-bot@users.noreply.github.com"
          git add recipes.json
          git commit -m "chore: refresh toddler recipe database"
          git push
