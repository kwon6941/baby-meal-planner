name: Apply dual recommendation UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-dual-recommend.yml'

permissions:
  contents: write
  pages: write
  id-token: write

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

jobs:
  apply-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply patch
        run: python tools/add_dual_recommend.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>', s)
          if not m:
              raise SystemExit('script not found')
          Path('/tmp/app.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Commit app changes
        shell: bash
        run: |
          if git diff --quiet -- index.html sw.js; then
            echo "No changes to commit."
          else
            git config user.name "app-fix-bot"
            git config user.email "app-fix-bot@users.noreply.github.com"
            git add index.html sw.js
            git commit -m "feat: add basic and DB recommendation modes"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
