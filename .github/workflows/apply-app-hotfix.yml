name: Apply app hotfix

on:
  push:
    paths:
      - '.github/workflows/apply-app-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply strict recipe matching
        run: python tools/apply_recipe_quality_fix.py
      - name: Install updater dependencies
        run: pip install -r requirements-updater.txt
      - name: Expand recipe database
        run: python tools/update_recipes.py
      - name: Commit changes
        run: |
          git config user.name "recipe-db-bot"
          git config user.email "recipe-db-bot@users.noreply.github.com"
          git add index.html sw.js tools/update_recipes.py recipes.json
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: strict recipe links and expand recipe database"
            git push
          fi
