name: Apply audited menu names v16

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-audited-menu-v16.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apply-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply audited menu names
        run: python tools/use_audited_menu_names.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m:
              raise SystemExit('script not found')
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
          python -m py_compile tools/update_recipes.py tools/menu_name_utils.py

      - name: Commit app changes
        shell: bash
        run: |
          git config user.name "app-fix-bot"
          git config user.email "app-fix-bot@users.noreply.github.com"
          git add index.html sw.js tools/update_recipes.py
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "fix: use audited recipe menu names v16"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
